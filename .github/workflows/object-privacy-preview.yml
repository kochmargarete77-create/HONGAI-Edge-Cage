name: Object privacy core research checks
on:
  push:
    branches: [native-desktop-development]
    paths: ['native-desktop/mcp-object-preview/**', '.github/workflows/object-privacy-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test only scoped-object core, no native desktop acceptance
        env:
          HONGAI_TEST_ROOT: ${{ runner.temp }}
        run: node native-desktop/mcp-object-preview/test-capability-vault.js
