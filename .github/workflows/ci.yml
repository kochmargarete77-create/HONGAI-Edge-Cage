name: security-ci

on:
  push:
    branches: [main, hongai-edge-cage-v0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --fund=false --audit=false
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production dependency audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate macOS shell scripts
        if: runner.os != 'Windows'
        run: sh -n platform/macos/install.sh platform/macos/start.sh platform/macos/uninstall.sh
      - name: Validate Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem platform/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors; $failed = $true }
          }
          if ($failed) { exit 1 }
