name: Native desktop boundary development checks
on:
  push:
    branches: [native-desktop-development]
    paths: ['native-desktop/macos/**', '.github/workflows/native-boundary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Policy unit tests on real macOS
        working-directory: native-desktop/macos
        run: swift test
      - name: Compile Network Extension adapter for Apple Silicon
        working-directory: native-desktop/macos
        run: swift build --arch arm64 --target HongAIContentFilter
      - name: Compile Network Extension adapter for Intel
        working-directory: native-desktop/macos
        run: swift build --arch x86_64 --target HongAIContentFilter
      - name: Test inheritable process boundary without host network changes
        working-directory: native-desktop/macos
        run: python3 process-sandbox/test_process_sandbox.py
      - name: Build universal native desktop launcher and installer
        working-directory: native-desktop/macos
        run: |
          python3 process-sandbox/test_official_desktop.py --prepare-source
          bash process-sandbox/build-app.sh
      - name: Official Claude Desktop offline start in production process sandbox
        working-directory: native-desktop/macos
        run: python3 process-sandbox/test_official_desktop.py
      - name: Install, open native UI, and remove exact test installation
        working-directory: native-desktop/macos
        run: python3 process-sandbox/test_installer.py
      - name: Save development evidence only
        run: |
          mkdir -p evidence
          printf '%s\n' 'COMPILE_ONLY=false' 'MAC_INSTALL_ACCEPTANCE=CI_PASS' 'OFFICIAL_DESKTOP_OFFLINE_START=PASS' 'SIGNATURE=AD_HOC' 'NOTARIZED=false' 'LOGIN_ACCEPTANCE=NOT_RUN' 'CUSTOMER_RELEASE=false' > evidence/native-development-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-native-boundary-development-evidence-${{ matrix.runner }}
          path: evidence
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-desktop-pilot-${{ matrix.runner }}
          path: |
            native-desktop/macos/process-sandbox/build/*.pkg
            native-desktop/macos/process-sandbox/build/SHA256SUMS.txt
            native-desktop/macos/process-sandbox/build/BUILD-STATUS.txt
            native-desktop/macos/process-sandbox/build/installed-native-ui.png
