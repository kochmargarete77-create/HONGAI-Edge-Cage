name: Native environment workbench and tool privacy
on:
  push:
    branches: [native-desktop-development]
    paths: ['native-desktop/environment-tools/**', '.github/workflows/environment-tools.yml', 'native-desktop/environment-installers/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: native-desktop/environment-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Windows native build and real executable checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:GOCACHE=Join-Path $env:RUNNER_TEMP 'hongai-go-cache'
          $env:GOTMPDIR=Join-Path $env:RUNNER_TEMP 'hongai-go-tmp'
          New-Item -ItemType Directory -Path $env:GOTMPDIR -Force|Out-Null
          $env:CGO_ENABLED='0';$env:GOTOOLCHAIN='local';$env:GOMAXPROCS='2'
          $env:HONGAI_TEST_ROOT=Join-Path (Get-Location) '.fixtures'
          New-Item -ItemType Directory -Path $env:HONGAI_TEST_ROOT,dist -Force|Out-Null
          $env:HONGAI_TOOL_BINARY=Join-Path (Get-Location) 'dist/hongai-tools.exe'
          go build -buildvcs=false -trimpath -ldflags "-s -w -H windowsgui -X main.buildID=$env:GITHUB_SHA" -o $env:HONGAI_TOOL_BINARY .
          if($LASTEXITCODE){throw 'BUILD_FAILED'}
          $env:HONGAI_VALID_INSTALLER=Join-Path $env:RUNNER_TEMP 'official-Claude.msix'
          $env:HONGAI_VALID_INSTALLER_SOURCE='https://downloads.claude.ai/releases/win32/x64/6.28899.6/Claude-2f5fc59b2d1c672dd9dced86720c50f48cca0cf9.msix'
          Invoke-WebRequest -Uri $env:HONGAI_VALID_INSTALLER_SOURCE -OutFile $env:HONGAI_VALID_INSTALLER -TimeoutSec 150
          if((Get-FileHash $env:HONGAI_VALID_INSTALLER).Hash -cne 'D95045A5354F2058FC380B5F1400AD3B66C841692644CB4C0C70CA3D4B6CCD5A'){throw 'OFFICIAL_FIXTURE_HASH_MISMATCH'}
          $nativePS=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $env:HONGAI_VERIFY_FILE=$env:HONGAI_VALID_INSTALLER
          & $nativePS -NoProfile -NonInteractive -Command '$env:PSModulePath=(Join-Path $env:WINDIR "System32\WindowsPowerShell\v1.0\Modules")+";"+(Join-Path $env:ProgramFiles "WindowsPowerShell\Modules");$s=Get-AuthenticodeSignature -LiteralPath $env:HONGAI_VERIFY_FILE;[pscustomobject]@{status=[string]$s.Status;signer=$s.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName,$false)}|ConvertTo-Json -Compress'
          & $nativePS -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop";$env:PSModulePath=(Join-Path $env:WINDIR "System32\WindowsPowerShell\v1.0\Modules")+";"+(Join-Path $env:ProgramFiles "WindowsPowerShell\Modules");Add-AppxPackage -Path $env:HONGAI_VALID_INSTALLER -ErrorAction Stop'
          if($LASTEXITCODE){throw 'OFFICIAL_NATIVE_REGISTRATION_FAILED'}
          $env:HONGAI_REQUIRE_REGISTERED_CLIENT='1'
          $env:HONGAI_UI_ARTIFACT_DIR=Join-Path (Get-Location) 'dist/ui'
          $env:HONGAI_BROWSER_FIXTURE_PATH=@('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')|Where-Object {Test-Path -LiteralPath $_}|Select-Object -First 1
          if(-not $env:HONGAI_BROWSER_FIXTURE_PATH){throw 'CI_BROWSER_FIXTURE_NOT_AVAILABLE'}
          go test -v -count=1 ./... 2>&1|Tee-Object -FilePath dist/native-tests.txt
          if($LASTEXITCODE){throw 'NATIVE_TESTS_FAILED'}
          & $env:HONGAI_TOOL_BINARY version|Out-File dist/component-status.json -Encoding utf8
          (Get-FileHash $env:HONGAI_TOOL_BINARY).Hash|Out-File dist/SHA256.txt -Encoding utf8
          $newBinary=$env:HONGAI_TOOL_BINARY
          $cli=& $newBinary version|ConvertFrom-Json
          if($LASTEXITCODE -or $cli.environmentVersion -cne '0.2.2-environment-preview' -or $cli.buildID -cne $env:GITHUB_SHA){throw 'CURRENT_CLI_METADATA_NOT_ACCEPTED'}
          $oldBinary=Join-Path $env:HONGAI_TEST_ROOT 'hongai-tools-old-build-fixture.exe'
          go build -buildvcs=false -trimpath -ldflags "-s -w -X main.buildID=old-fixture-$env:GITHUB_SHA" -o $oldBinary .
          if($LASTEXITCODE){throw 'OLD_BUILD_FIXTURE_FAILED'}
          $env:HONGAI_TOOL_BINARY=$oldBinary
          go test -v -count=1 ./... 2>&1|Tee-Object -FilePath dist/native-tests-old-fixture.txt
          if($LASTEXITCODE){throw 'OLD_BUILD_FIXTURE_NATIVE_TESTS_FAILED'}
          $oldCLI=& $oldBinary version|ConvertFrom-Json
          if($LASTEXITCODE -or $oldCLI.buildID -cne ('old-fixture-'+$env:GITHUB_SHA)){throw 'OLD_BUILD_FIXTURE_CLI_FAILED'}
          $env:HONGAI_TOOL_BINARY=$newBinary
          $installerRoot=Join-Path (Get-Location) '../environment-installers'
          python (Join-Path $installerRoot 'build-brand-icons.py') --output (Join-Path (Get-Location) 'dist/brand')
          if($LASTEXITCODE){throw 'BRAND_ICON_BUILD_FAILED'}
          $newHash=(Get-FileHash -LiteralPath $newBinary).Hash.ToLowerInvariant()
          $oldHash=(Get-FileHash -LiteralPath $oldBinary).Hash.ToLowerInvariant()
          $msiRoot=Join-Path (Get-Location) 'dist/msi'
          New-Item -ItemType Directory -Path $msiRoot -Force|Out-Null
          foreach($pair in @(@('old',$oldHash),@('new',$newHash))){
            $validation=@{schema='hongai.windows-payload-validation.v1';sha256=$pair[1];sourceCommit=$env:GITHUB_SHA;nativeTestsPassed=$true;cliSmokePassed=$true;executableMode=$(if($pair[0] -eq 'new'){'windowsgui'}else{'console'});fixtureScope='SAME_SOURCE_SEPARATELY_BUILT_AND_TESTED_BUILD_METADATA_VARIANTS_NOT_PREVIOUS_RELEASE_PROOF'}
            [IO.File]::WriteAllText((Join-Path $msiRoot ($pair[0]+'-payload-validation.json')),($validation|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          }
          $builder=Join-Path $installerRoot 'windows/Build-PerUserMsi.ps1'
          $brand=Join-Path (Get-Location) 'dist/brand/HONGAI.ico'
          $license=Join-Path (& go env GOROOT) 'LICENSE'
          & $builder -PayloadFile $oldBinary -ExpectedSHA256 $oldHash -ProductVersion '0.2.1' -SourceCommit $env:GITHUB_SHA -LicenseFile $license -OutputDirectory (Join-Path $msiRoot 'old') -PayloadValidationJson (Join-Path $msiRoot 'old-payload-validation.json') -IconFile $brand
          & $builder -PayloadFile $newBinary -ExpectedSHA256 $newHash -ProductVersion '0.2.2' -SourceCommit $env:GITHUB_SHA -LicenseFile $license -OutputDirectory (Join-Path $msiRoot 'new') -PayloadValidationJson (Join-Path $msiRoot 'new-payload-validation.json') -IconFile $brand
          & (Join-Path $installerRoot 'windows/Test-PerUserMsi.ps1') -OldMsi (Join-Path $msiRoot 'old/HONGAI-Environment-Workbench-0.2.1-x64.msi') -NewMsi (Join-Path $msiRoot 'new/HONGAI-Environment-Workbench-0.2.2-x64.msi') -OutputDirectory (Join-Path $msiRoot 'validation')

      - name: Mac native build, protected storage, installation and real executable checks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0 GOTOOLCHAIN=local GOMAXPROCS=2
          export GOCACHE="$RUNNER_TEMP/hongai-go-cache" GOTMPDIR="$RUNNER_TEMP/hongai-go-tmp"
          mkdir -p "$GOTMPDIR" .fixtures dist
          export HONGAI_TEST_ROOT="$(pwd -P)/.fixtures"
          export HONGAI_TOOL_BINARY="$(pwd -P)/dist/hongai-tools"
          go build -buildvcs=false -trimpath -ldflags "-s -w -X main.buildID=$GITHUB_SHA" -o "$HONGAI_TOOL_BINARY" .
          codesign --force --sign - --timestamp=none "$HONGAI_TOOL_BINARY"
          official="$(cd "$RUNNER_TEMP" && pwd -P)/official-fixture"
          mkdir -p "$official"
          curl --fail --max-time 30 --proto '=https' 'https://downloads.claude.ai/releases/darwin/universal/RELEASES.json' -o "$official/releases.json"
          export HONGAI_VALID_INSTALLER_SOURCE="$(python3 -c 'import json,sys,urllib.parse; d=json.load(open(sys.argv[1])); r=next(x for x in d["releases"] if x["version"]==d["currentRelease"]); u=r["updateTo"]["url"]; p=urllib.parse.urlparse(u); assert p.scheme=="https" and p.hostname=="downloads.claude.ai" and not p.query and not p.fragment and p.path.endswith(".zip"); print(u)' "$official/releases.json")"
          curl --fail --max-time 150 --max-filesize 1200000000 --proto '=https' "$HONGAI_VALID_INSTALLER_SOURCE" -o "$official/Claude.zip"
          python3 -c 'import zipfile,sys,posixpath; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); assert all(not n.startswith("/") and ".." not in n.split("/") for n in names); links=[(i,z.read(i).decode()) for i in z.infolist() if (i.external_attr>>16)&0o170000==0o120000]; assert all(not t.startswith("/") and not posixpath.normpath(posixpath.join(posixpath.dirname(i.filename),t)).startswith("../") for i,t in links)' "$official/Claude.zip"
          ditto -x -k "$official/Claude.zip" "$official/expanded"
          export HONGAI_VALID_INSTALLER="$official/expanded/Claude.app"
          mkdir -p "$HOME/Applications"
          test ! -e "$HOME/Applications/Claude.app"
          ditto "$HONGAI_VALID_INSTALLER" "$HOME/Applications/Claude.app"
          export HONGAI_REQUIRE_REGISTERED_CLIENT=1
          export HONGAI_UI_ARTIFACT_DIR="$(pwd -P)/dist/ui"
          export HONGAI_BROWSER_FIXTURE_PATH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$HONGAI_BROWSER_FIXTURE_PATH"
          go test -v -count=1 ./... 2>&1 | tee dist/native-tests.txt
          GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "-s -w -X main.buildID=$GITHUB_SHA" -o dist/hongai-tools-amd64 .
          GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "-s -w -X main.buildID=$GITHUB_SHA" -o dist/hongai-tools-arm64 .
          lipo -create -output dist/hongai-tools-universal dist/hongai-tools-amd64 dist/hongai-tools-arm64
          codesign --force --sign - --timestamp=none dist/hongai-tools-universal
          codesign --verify --strict dist/hongai-tools-universal
          dist/hongai-tools-universal version > dist/component-status.json
          shasum -a 256 dist/hongai-tools-universal > dist/SHA256.txt
          installer_root="$(cd ../environment-installers && pwd -P)"
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$installer_root/build-brand-icons.py" --output "$(pwd -P)/dist/brand"
          export HONGAI_MAC_PACKAGE_TEST_ROOT="$(pwd -P)/.fixtures/mac-package-guards"
          mkdir -p "$HONGAI_MAC_PACKAGE_TEST_ROOT"
          python3 -m unittest discover -s "$installer_root/mac" -p test_mac_installer.py -v
          runtime_sha="$(shasum -a 256 dist/hongai-tools-universal | awk '{print $1}')"
          bash "$installer_root/mac/build-mac-installer.sh" --runtime "$(pwd -P)/dist/hongai-tools-universal" --sha256 "$runtime_sha" --version 0.2.2 --icon "$(pwd -P)/dist/brand/HONGAI.icns" --output "$(pwd -P)/dist/installers"
          bash "$installer_root/mac/verify-mac-installer.sh" --manifest "$(pwd -P)/dist/installers/installer-manifest.json"
          bash "$installer_root/mac/ci-install-smoke.sh" --manifest "$(pwd -P)/dist/installers/installer-manifest.json" --disposable-ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tool-privacy-${{ matrix.runner }}
          path: |
            native-desktop/environment-tools/dist/hongai-tools.exe
            native-desktop/environment-tools/dist/hongai-tools-universal
            native-desktop/environment-tools/dist/*.json
            native-desktop/environment-tools/dist/*.txt
            native-desktop/environment-tools/dist/ui/*.png
            native-desktop/environment-tools/dist/ui/*.json
            native-desktop/environment-tools/dist/installers/*.pkg
            native-desktop/environment-tools/dist/installers/*app.zip
            native-desktop/environment-tools/dist/installers/installer-manifest.json
            native-desktop/environment-tools/dist/installers/ci-install-report.json
            native-desktop/environment-tools/dist/msi/new/*.msi
            native-desktop/environment-tools/dist/msi/new/*.json
            native-desktop/environment-tools/dist/msi/validation/MSI-VALIDATION.json
            native-desktop/environment-tools/dist/msi/validation/*.log
